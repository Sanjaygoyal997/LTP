<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Curing Press Status</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="title">
      <span class="plant">JK Lakshmi &mdash; Curing Press Status</span>
      <span class="shift" id="shiftLabel">Shift A</span>
    </div>
    <div class="topbar-right">
      <span class="conn" id="connState"><i class="dot"></i><span id="connText">Connecting…</span></span>
      <span class="clock" id="clock">--:--:--</span>
      <button class="btn" id="fsBtn" title="Toggle full screen (F)">⛶</button>
    </div>
  </header>

  <main class="floor" id="floor"><!-- bays rendered here --></main>

  <footer class="statusbar">
    <fieldset class="panel production">
      <legend>Production</legend>
      <div class="counters" id="production"></div>
    </fieldset>

    <fieldset class="panel press-totals">
      <legend>Press</legend>
      <div class="total-row">
        <span class="total-label">Total Curing Running</span>
        <span class="total-value" id="totalRunning">0</span>
      </div>
      <div class="total-row">
        <span class="total-label">Total Curing Stop</span>
        <span class="total-value" id="totalStop">0</span>
      </div>
    </fieldset>

    <fieldset class="panel legend">
      <legend>Legends</legend>
      <div class="legend-items" id="legendItems"></div>
    </fieldset>
  </footer>

  <div class="tooltip" id="tooltip" hidden></div>

  <script src="js/layout.js"></script>
  <script src="js/data-source.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
